detect:

  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: or
    rules:
    - case sensitive: false
      op: ends with
      path: event/FILE_PATH
      value: lazagne.exe
    - case sensitive: false
      op: ends with
      path: event/COMMAND_LINE
      value: all
    - case sensitive: false
      op: contains
      path: event/COMMAND_LINE
      value: lazagne  
    - case sensitive: false
      op: is
      path: event/HASH
      value:  'dc06d62ee95062e714f2566c95b8edaabfd387023b1bf98a09078b84007d5268'


respond:

- action: report
  metadata:
    author: RaySec@SOADEDR
    description: LaZagne (SOAR-EDR-Tool) 
      from view
    falsepositives:
    - Unlikely alerts
    level: medium
    tags:
    - attack.credential_access
  name: RaySec - HackTool - LaZagne (SOAR-EDR)